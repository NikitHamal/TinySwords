# Default keystore credentials for the Tiny Swords RTS Android port.
#
# This keystore is intentionally committed to the repository because the
# project owner has stated the repo is private and they need every push
# to produce installable signed builds without coordinating secrets.
#
# Treat the keystore as PUBLIC and do NOT use it to sign anything else.
storeFile=../keystore/tinyswords.jks
storePassword=tinyswords
keyAlias=tinyswords
keyPassword=tinyswords
