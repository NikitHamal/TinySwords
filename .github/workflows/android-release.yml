name: Android Release APK

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK after commit hash
        run: |
          mkdir -p release-apks
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/release/app-release.apk "release-apks/tinyswords-realm-war-${SHORT_SHA}.apk"
          ls -lah release-apks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyswords-realm-war-${{ github.sha }}
          path: release-apks/*.apk
          if-no-files-found: error
