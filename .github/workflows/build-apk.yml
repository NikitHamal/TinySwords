name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute commit metadata
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building commit ${SHORT_SHA}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Assemble release & debug APKs
        working-directory: android
        env:
          COMMIT_SHA: ${{ github.sha }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APKs
        id: apks
        working-directory: android
        run: |
          set -e
          RELEASE_APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          DEBUG_APK="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          echo "release_apk=android/${RELEASE_APK}" >> "$GITHUB_OUTPUT"
          echo "debug_apk=android/${DEBUG_APK}" >> "$GITHUB_OUTPUT"
          echo "Release APK: ${RELEASE_APK}"
          echo "Debug APK:   ${DEBUG_APK}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TinySwords-RealmWar-release-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.apks.outputs.release_apk }}
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TinySwords-RealmWar-debug-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.apks.outputs.debug_apk }}
          if-no-files-found: error
