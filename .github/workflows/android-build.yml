name: Android Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute short commit hash
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            # Generate the wrapper from the system gradle if the script isn't checked in.
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Assemble release APK
        working-directory: android
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        id: apk
        working-directory: android
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Built: $apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        working-directory: android
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          "$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyswords-${{ steps.vars.outputs.short_sha }}
          path: android/${{ steps.apk.outputs.path }}
          if-no-files-found: error
